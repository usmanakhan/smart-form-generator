<main class="max-w-2xl mx-auto p-6 space-y-6">
  <div class="bg-white p-4 rounded-lg shadow border border-slate-200">
    <label class="block text-sm font-bold text-slate-700 mb-2">Describe Your Form:</label>
    <div class="flex gap-2">
      <input [(ngModel)]="prompt" placeholder="e.g., A registration form with username, email, and terms"
        class="flex-1 p-2 border border-slate-300 rounded focus:ring-2 focus:ring-indigo-500" />
      <button (click)="generate()" [disabled]="isLoading()"
        class="px-4 py-2 bg-indigo-600 text-white font-bold rounded hover:bg-indigo-700 disabled:bg-slate-300">
        {{ isLoading() ? 'Generating...' : 'Generate' }}
      </button>
    </div>
  </div>

  <!-- Live Stream Preview -->
  @if (isLoading()) {
  <pre class="p-3 bg-slate-900 text-emerald-400 text-xs rounded overflow-x-auto max-h-40">{{ streamingRawText() }}</pre>
  }

  <!-- Render Dynamic Form once validated -->
  @if (currentConfig()) {
  <app-dynamic-form-generator [config]="currentConfig()!" />
  }
</main>
