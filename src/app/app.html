<main class="max-w-2xl mx-auto p-6 space-y-6">
  <div class="min-h-screen bg-slate-100 py-10 px-4">
    <div class="max-w-2xl mx-auto space-y-6">

      <!-- Header -->
      <header class="text-center space-y-1">
        <h1 class="text-3xl font-black text-slate-900 tracking-tight">Smart Angular Form Generator</h1>
        <p class="text-sm text-slate-600">Month 1 Project: Agentic SDLC & Structured Schema Outputs</p>
      </header>

      <!-- Day 2: Prompt Input Controller -->
      <app-form-prompt-controller (generateRequest)="onGenerate($event)">
      </app-form-prompt-controller>

      <!-- Live Streaming Raw Telemetry / Token Feed -->
      @if (isLoading()) {
      <div class="bg-slate-900 text-emerald-400 p-4 rounded-xl font-mono text-xs shadow-inner overflow-hidden">
        <div
          class="flex items-center justify-between pb-2 border-b border-slate-800 text-slate-400 text-[10px] uppercase">
          <span>Streaming Tokens from Gemini</span>
          <span class="animate-pulse text-indigo-400">● LIVE</span>
        </div>
        <pre class="mt-2 whitespace-pre-wrap max-h-48 overflow-y-auto leading-relaxed">{{ streamFeed() }}</pre>
      </div>
      }

      <!-- Dynamic Form Generated Output -->
      @if (currentConfig()) {
      <app-dynamic-form-generator [config]="currentConfig()!" />
      }
    </div>
  </div>
</main>
